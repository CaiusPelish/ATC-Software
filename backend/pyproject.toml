[project]
name = "hold-short-backend"
version = "0.1.0"
description = "FastAPI backend for the Hold Short airport taxi simulation"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "numpy>=1.26,<3",
    "opencv-python-headless>=4.10,<5",
    "pillow>=10,<13",
    "python-multipart>=0.0.20,<1",
    "torch>=2.2,<3",
    "transformers>=4.45,<5",
    "uvicorn[standard]>=0.34,<1",
]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[dependency-groups]
analysis = [
    "huggingface-hub>=0.36.2",
    "matplotlib>=3.11.2",
    "pandas>=3.0.6",
]

[tool.uv]
package = false
